<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:13px system-ui;color:#485844;background:#fffdf8;margin:12px}textarea{width:95%;height:44px;border:1px solid #ccc;border-radius:8px;padding:7px;font:12px system-ui}p{margin:6px 0;font-size:12px}</style></head><body><p>Нажмите «Загрузить изображения». Фото отправится в ImgBB и будет доступно по ссылке.</p><textarea id="result" aria-label="Ссылка или код изображения из ImgBB" placeholder="Здесь появится ссылка. Если нужно, вставьте прямую ссылку i.ibb.co вручную."></textarea><script async src="https://imgbb.com/upload.js" data-auto-insert="bbcode-embed-full" data-lang="ru"></script><script>
let last='';setInterval(()=>{const text=document.getElementById('result').value;if(text===last)return;last=text;const m=text.match(/https:\/\/i\.ibb\.co\/[^\s\[\]<>"'()]+/);if(m)parent.postMessage({type:'public-image',url:m[0]},'*');},400);
</script></body></html>
