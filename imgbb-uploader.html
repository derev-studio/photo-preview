<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:14px system-ui;color:#485844;background:#fffdf8;margin:10px}p{margin:8px 0;font-size:12px}button{cursor:pointer}button[data-chevereto-pup-trigger]{padding:12px 20px!important;background:#485844!important;color:white!important;border-radius:22px!important;font:14px system-ui!important}textarea{width:95%;height:52px;border:1px solid #ccc;border-radius:8px;padding:8px;font:12px system-ui}details{margin-top:12px}summary{cursor:pointer;font-size:12px}.chevereto-pup-container{display:block!important}</style></head><body><p>Выберите фото в окне ImgBB и завершите загрузку. Снимок вернётся в примерочную.</p><div id="button-place"></div><details><summary>Вставить ссылку вручную</summary><textarea id="result" aria-label="Ссылка или код изображения из ImgBB" placeholder="Прямая ссылка i.ibb.co или BBCode из ImgBB"></textarea></details><script async src="https://imgbb.com/upload.js" data-auto-insert="bbcode-embed-medium" data-lang="ru" data-sibling="#button-place" data-sibling-pos="after"></script><script>
let last='';setInterval(()=>{const text=document.getElementById('result').value;if(text===last)return;last=text;const m=text.match(/https:\/\/i\.ibb\.co\/[^\s\[\]<>"'()]+/);if(m)parent.postMessage({type:'public-image',url:m[0]},'*');},250);
</script></body></html>
