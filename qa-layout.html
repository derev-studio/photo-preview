<!doctype html><html lang="ru"><meta charset="utf-8"><title>Проверка размеров примерочной</title><style>body{margin:12px;font:16px system-ui;background:#ddd}button{font:inherit;padding:10px;margin:4px}iframe{display:block;border:1px solid #777;background:#f1eee7;margin:12px 0}</style><p>Проверка адаптации — размеры области сайта без панелей браузера.</p><button data-size="390,700">Телефон 390 × 700</button><button data-size="360,600">Телефон 360 × 600</button><button data-size="844,330">Телефон горизонтально</button><button data-size="1280,760">Компьютер</button><button id="qa-panel">Проверить панель без WebGL</button><button id="qa-save">Сохранить тестовый макет</button><iframe title="Проверяемая примерочная" src="./index.html" width="390" height="700"></iframe><script>document.querySelectorAll('button[data-size]').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(',');const frame=document.querySelector('iframe');frame.width=w;frame.height=h;});document.getElementById('qa-panel').onclick=()=>{const d=document.querySelector('iframe').contentDocument.querySelector('#viewer').contentDocument;d.body.classList.add('editing');d.getElementById('controls-panel').show();d.getElementById('customizer').inert=false;};document.getElementById('qa-save').onclick=async()=>{const c=document.createElement('canvas');c.width=600;c.height=600;const g=c.getContext('2d');g.fillStyle='#f1eee7';g.fillRect(0,0,600,600);g.fillStyle='#345';g.font='32px sans-serif';g.fillText('Тест сохранения макета',65,300);await document.querySelector('iframe').contentWindow.saveMugPreview({data:c.toDataURL('image/png'),name:'Проверка сохранения.png',body:'Белая',handle:'Жёлтая'});};</script></html>
