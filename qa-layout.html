<!doctype html><html lang="ru"><meta charset="utf-8"><title>Проверка размеров примерочной</title><style>body{margin:12px;font:16px system-ui;background:#ddd}button{font:inherit;padding:10px;margin:4px}iframe{display:block;border:1px solid #777;background:#f1eee7;margin:12px 0}</style><p>Проверка адаптации — размеры области сайта без панелей браузера.</p><button data-size="390,700">Телефон 390 × 700</button><button data-size="360,600">Телефон 360 × 600</button><button data-size="844,330">Телефон горизонтально</button><button data-size="1280,760">Компьютер</button><iframe title="Проверяемая примерочная" src="./index.html" width="390" height="700"></iframe><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(',');const frame=document.querySelector('iframe');frame.width=w;frame.height=h;});</script></html>
